<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation | MACHI - Modern Japanese Kitchen & Matcha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/output.css">
</head>
<body class="bg-brand-cream text-brand-charcoal antialiased">
    <header class="sticky top-0 z-50 bg-brand-cream/95 backdrop-blur-sm border-b border-brand-charcoal/10 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="../index.html" class="flex flex-col justify-center group outline-none">
                    <span class="font-heading font-bold text-3xl tracking-tight text-brand-charcoal">MACHI</span>
                </a>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="text-sm font-medium text-brand-charcoal hover:text-brand-primary">Home</a>
                    <a href="menu.html" class="text-sm font-medium text-brand-charcoal hover:text-brand-primary">Menu</a>
                    <a href="about.html" class="text-sm font-medium text-brand-charcoal hover:text-brand-primary">About</a>
                    <a href="promo.html" class="text-sm font-medium text-brand-charcoal hover:text-brand-primary">Promo</a>
                    <a href="location.html" class="text-sm font-medium text-brand-charcoal hover:text-brand-primary">Location</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="py-16 md:py-24 relative overflow-hidden">
        <!-- Background Decor -->
        <div class="absolute top-0 right-0 w-1/3 h-full pattern-seigaiha opacity-30 pointer-events-none"></div>
        <div class="absolute -left-32 top-32 w-96 h-96 bg-brand-primary/5 rounded-full blur-3xl pointer-events-none"></div>

        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="text-center mb-12">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-primary text-white mb-6 shadow-md border-4 border-white">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold font-heading text-brand-charcoal mb-4">Reserve Your Table</h1>
                <p class="text-lg text-brand-charcoal/70">Join us for a comforting meal. Book your spot today.</p>
            </div>

            <!-- Form -->
            <div class="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-brand-washi relative">
                <!-- Red Accent Line -->
                <div class="absolute top-0 left-12 right-12 h-1 bg-brand-primary rounded-b-md"></div>
                
                <form action="#" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Name -->
                        <div>
                            <label for="name" class="block text-sm font-bold text-brand-charcoal mb-2">Full Name</label>
                            <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-xl border border-brand-charcoal/20 bg-brand-cream/20 focus:bg-white focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all placeholder-brand-charcoal/30" placeholder="John Doe">
                        </div>
                        
                        <!-- Phone -->
                        <div>
                            <label for="phone" class="block text-sm font-bold text-brand-charcoal mb-2">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required class="w-full px-4 py-3 rounded-xl border border-brand-charcoal/20 bg-brand-cream/20 focus:bg-white focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all placeholder-brand-charcoal/30" placeholder="0812-xxxx-xxxx">
                        </div>
                        
                        <!-- Date -->
                        <div>
                            <label for="date" class="block text-sm font-bold text-brand-charcoal mb-2">Date</label>
                            <input type="date" id="date" name="date" required class="w-full px-4 py-3 rounded-xl border border-brand-charcoal/20 bg-brand-cream/20 focus:bg-white focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all text-brand-charcoal">
                        </div>
                        
                        <!-- Time -->
                        <div>
                            <label for="time" class="block text-sm font-bold text-brand-charcoal mb-2">Time</label>
                            <select id="time" name="time" required class="w-full px-4 py-3 rounded-xl border border-brand-charcoal/20 bg-brand-cream/20 focus:bg-white focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all text-brand-charcoal appearance-none">
                                <option value="" disabled selected>Select time</option>
                                <option value="10:00">10:00</option>
                                <option value="12:00">12:00 (Lunch)</option>
                                <option value="14:00">14:00</option>
                                <option value="16:00">16:00</option>
                                <option value="18:00">18:00 (Dinner)</option>
                                <option value="20:00">20:00</option>
                            </select>
                        </div>
                        
                        <!-- Guests -->
                        <div class="md:col-span-2">
                            <label for="guests" class="block text-sm font-bold text-brand-charcoal mb-2">Number of Guests</label>
                            <select id="guests" name="guests" required class="w-full px-4 py-3 rounded-xl border border-brand-charcoal/20 bg-brand-cream/20 focus:bg-white focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all text-brand-charcoal appearance-none">
                                <option value="1">1 Person</option>
                                <option value="2" selected>2 People</option>
                                <option value="3">3 People</option>
                                <option value="4">4 People</option>
                                <option value="5">5 People</option>
                                <option value="6+">6+ People (Large Group)</option>
                            </select>
                        </div>
                        
                        <!-- Special Request -->
                        <div class="md:col-span-2">
                            <label for="request" class="block text-sm font-bold text-brand-charcoal mb-2">Special Request (Optional)</label>
                            <textarea id="request" name="request" rows="4" class="w-full px-4 py-3 rounded-xl border border-brand-charcoal/20 bg-brand-cream/20 focus:bg-white focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all placeholder-brand-charcoal/30 resize-none" placeholder="Any dietary requirements or special occasions?"></textarea>
                        </div>
                    </div>
                    
                    <div class="pt-6 border-t border-brand-washi">
                        <button type="submit" class="w-full py-4 rounded-xl bg-brand-primary text-white font-bold text-lg hover:bg-brand-deep hover:-translate-y-1 transition-all shadow-[0_8px_20px_-6px_rgba(217,45,32,0.6)] outline-none focus-visible:ring-4 focus-visible:ring-brand-primary/50">
                            Reserve Table
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="mt-8 text-center text-sm text-brand-charcoal/60">
                <p>For same-day reservations or parties larger than 8, please call us directly at <a href="tel:+628120000000" class="font-bold text-brand-primary hover:underline">+62 812-xxxx-xxxx</a>.</p>
            </div>
        </div>
    </main>
</body>
</html>
