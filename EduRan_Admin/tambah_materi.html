<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Materi - Panel Pengelola BLEDERA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">ER</div>
      EduRan
    </div>
    <div class="menu-section">
      <div class="menu-label">Menu Utama</div>
      <a href="index.html" class="nav-item">Dashboard</a>
      <a href="experience.html" class="nav-item">Experience</a>
      <a href="materi.html" class="nav-item active">Materi</a>
      <a href="video.html" class="nav-item">Video & Panduan</a>
      <a href="pengunjung.html" class="nav-item">Pengunjung</a>
      <a href="penyelesaian.html" class="nav-item">Penyelesaian Experience</a>

    </div>
    <div class="sidebar-bottom">
      <a href="bantuan.html" class="nav-item">Bantuan</a>
      <a href="pengaturan.html" class="nav-item">Pengaturan</a>
      <a href="login.html" class="nav-item">Keluar</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-breadcrumb">Panel Pengelola / Materi / Tambah</div>
      </div>
      <div class="topbar-right">
        <a href="#" class="notification-btn" style="text-decoration:none; color:inherit; font-size:12px; font-weight:bold; display:flex; align-items:center; justify-content:center;">
          Notif
          <div class="notification-dot"></div>
        </a>
        <div class="user-profile">
          <div class="user-avatar">PB</div>
          <div class="user-info">
            <span class="user-name">Pengelola BLEDERA</span>
            <span class="user-role">Administrator</span>
          </div>
          <span style="font-size:12px; color:#9ca3af;">▼</span>
        </div>
      </div>
    </header>

    <div class="content-wrapper">
      
      <div class="page-header" style="margin-bottom:24px;">
        <h1 style="font-size:32px; font-weight:700; color:var(--text-dark); margin-bottom:8px;">Tambah Materi Baru</h1>
        <p style="color:var(--text-muted);">Unggah dokumen dan materi pembelajaran untuk mendukung Experience.</p>
      </div>

      <div class="panel" style="padding:32px;">
        <form action="materi.html" method="GET" style="display:flex; flex-direction:column; gap:24px; max-width:600px;">
          
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Judul Materi</label>
            <input type="text" required placeholder="Contoh: Pengenalan Rempah Lokal" style="padding:14px; border:1px solid var(--border-color); border-radius:8px; outline:none; font-family:inherit; font-size:14px;">
          </div>
          
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Pilih Experience</label>
            <select required style="padding:14px; border:1px solid var(--border-color); border-radius:8px; outline:none; font-family:inherit; font-size:14px; background-color:white;">
              <option value="">-- Pilih Experience --</option>
              <option value="live-cooking">Live Cooking</option>
              <option value="kampung-sayur">Kampung Sayur</option>
            </select>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Deskripsi Singkat</label>
            <textarea rows="4" required placeholder="Jelaskan secara singkat isi materi ini..." style="padding:14px; border:1px solid var(--border-color); border-radius:8px; outline:none; font-family:inherit; resize:vertical; font-size:14px;"></textarea>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Unggah Berkas Dokumen</label>
            <input type="file" accept=".pdf,.doc,.docx" required style="padding:14px; border:1px dashed var(--border-color); border-radius:8px; outline:none; font-family:inherit; font-size:14px; cursor:pointer; background-color:#f8fafc;">
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Status Penerbitan</label>
            <select style="padding:14px; border:1px solid var(--border-color); border-radius:8px; outline:none; font-family:inherit; font-size:14px; background-color:white; width:200px;">
              <option value="terbit">Terbit</option>
              <option value="draf">Simpan sebagai Draf</option>
            </select>
          </div>

          <div style="display:flex; gap:16px; margin-top:16px; align-items:center;">
            <button type="submit" class="btn-primary" style="padding:14px 24px; font-size:14px;">Simpan Materi</button>
            <a href="materi.html" class="btn-outline" style="text-decoration:none; padding:14px 24px; font-size:14px;">Batal</a>
          </div>
        </form>
      </div>

    </div>
  </main>
</body>
</html>
