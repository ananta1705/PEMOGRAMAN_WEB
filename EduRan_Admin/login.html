<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Panel Pengelola BLEDERA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; background-color:#f8fafc;">
  <div class="panel" style="padding:40px; width:100%; max-width:400px; text-align:center;">
    <div class="brand-logo" style="margin:0 auto 16px auto; background-color:var(--primary); color:white; width:48px; height:48px; font-size:20px; border-radius:12px;">ER</div>
    <h1 style="font-size:24px; font-weight:700; color:var(--text-dark); margin-bottom:8px;">Masuk ke EduRan</h1>
    <p style="color:var(--text-muted); margin-bottom:32px;">Panel Pengelola Desa BLEDERA</p>
    
    <form action="index.html" method="GET" style="display:flex; flex-direction:column; gap:16px; text-align:left;">
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Email</label>
        <input type="email" required placeholder="admin@blederan.desa.id" style="padding:12px; border:1px solid var(--border-color); border-radius:8px; outline:none; font-family:inherit; font-size:14px;">
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:14px; font-weight:600; color:var(--text-dark);">Kata Sandi</label>
        <input type="password" required placeholder="••••••••" style="padding:12px; border:1px solid var(--border-color); border-radius:8px; outline:none; font-family:inherit; font-size:14px;">
      </div>
      <button type="submit" class="btn-primary" style="justify-content:center; padding:12px; margin-top:8px; font-size:14px;">Masuk</button>
    </form>
  </div>
</body>
</html>
